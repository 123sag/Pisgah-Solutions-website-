<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pisgah Solutions — Admin Dashboard</title>
<meta name="robots" content="noindex, nofollow">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --purple:#6b21c9;
    --purple-dark:#4c1a94;
    --bg:#f4f2fb;
    --card:#ffffff;
    --text:#1f1a2e;
    --muted:#6b6478;
    --border:#e4dff5;
    --green:#1fa96a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  header{
    background:var(--purple);
    color:#fff;
    padding:18px 28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  header h1{
    margin:0;
    font-size:1.25rem;
  }
  header .status{
    display:flex;
    align-items:center;
    gap:12px;
    font-size:0.85rem;
    color:rgba(255,255,255,0.85);
  }
  header .dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#ccc;
    display:inline-block;
  }
  header .dot.live{
    background:#34d399;
    box-shadow:0 0 8px #34d399;
  }
  .logout-btn {
    background: rgba(255, 255, 255, 0.2);
    border: none;
    color: #fff;
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    transition: background 0.2s ease;
  }
  .logout-btn:hover {
    background: rgba(255, 255, 255, 0.35);
  }

  main{
    max-width:1200px;
    margin:32px auto;
    padding:0 20px;
  }

  /* LOGIN OVERLAY STYLES */
  #loginOverlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(31, 26, 46, 0.95);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10000;
  }

  .login-card {
    background: var(--card);
    padding: 40px 32px;
    border-radius: 16px;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
    width: 100%;
    max-width: 380px;
    border: 1px solid var(--border);
    text-align: center;
  }

  .login-card h2 {
    margin: 0 0 8px 0;
    color: var(--purple-dark);
    font-size: 1.5rem;
  }

  .login-card p {
    color: var(--muted);
    font-size: 0.88rem;
    margin-bottom: 24px;
  }

  .login-group {
    margin-bottom: 16px;
    text-align: left;
  }

  .login-group label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--text);
  }

  .login-group input {
    width: 100%;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.95rem;
    background: var(--bg);
    color: var(--text);
  }

  .login-group input:focus {
    outline: none;
    border-color: var(--purple);
  }

  .login-btn {
    width: 100%;
    padding: 12px;
    background: var(--purple);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
    transition: background 0.2s ease;
  }

  .login-btn:hover {
    background: var(--purple-dark);
  }

  .login-error {
    color: #e53e3e;
    font-size: 0.85rem;
    margin-top: 14px;
    display: none;
  }

  /* DASHBOARD STYLES */
  .grid-summary{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
    gap:18px;
    margin-bottom:32px;
  }
  .card-stat{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:20px 22px;
  }
  .card-stat .label{
    font-size:0.8rem;
    text-transform:uppercase;
    letter-spacing:1px;
    color:var(--muted);
    font-weight:600;
  }
  .card-stat .value{
    font-size:2.2rem;
    font-weight:800;
    color:var(--purple-dark);
    margin-top:6px;
  }

  .section-box{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:24px;
    margin-bottom:32px;
  }
  .section-box h2{
    margin:0 0 18px 0;
    font-size:1.1rem;
    color:var(--purple-dark);
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  table{
    width:100%;
    border-collapse:collapse;
    font-size:0.9rem;
  }
  th, td{
    padding:12px 14px;
    text-align:left;
    border-bottom:1px solid var(--border);
  }
  th{
    background:var(--bg);
    color:var(--muted);
    font-weight:600;
    font-size:0.8rem;
    text-transform:uppercase;
  }
</style>
</head>
<body>

<div id="loginOverlay">
  <div class="login-card">
    <h2>Admin Portal</h2>
    <p>Please enter credentials to access live records</p>
    <form id="adminLoginForm">
      <div class="login-group">
        <label for="adminEmail">Email Address</label>
        <input type="email" id="adminEmail" required placeholder="admin@pisgahsolutions.com">
      </div>
      <div class="login-group">
        <label for="adminPassword">Password</label>
        <input type="password" id="adminPassword" required placeholder="••••••••">
      </div>
      <button type="submit" class="login-btn">Log In</button>
      <div id="loginError" class="login-error">Invalid login credentials.</div>
    </form>
  </div>
</div>

<header>
  <h1>Pisgah Solutions — Admin Dashboard</h1>
  <div class="status">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">Connecting...</span>
    <button class="logout-btn" onclick="handleLogout()">Logout</button>
  </div>
</header>

<main>
  <div class="grid-summary">
    <div class="card-stat">
      <div class="label">Total Contacts</div>
      <div class="value" id="contactCount">0</div>
    </div>
    <div class="card-stat">
      <div class="label">Total Audits</div>
      <div class="value" id="auditCount">0</div>
    </div>
  </div>

  <div class="section-box">
    <h2>Contact Inquiries</h2>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Message</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody id="contactBody">
        <tr><td colspan="5" style="text-align:center; color:var(--muted);">Loading contacts...</td></tr>
      </tbody>
    </table>
  </div>
</main>

<script>
  const SUPABASE_URL = 'YOUR_PROJECT_URL';     // Replace with your project URL
  const SUPABASE_KEY = 'YOUR_ANON_PUBLIC_KEY'; // Replace with your anon key

  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let contacts = [];
  let audits = [];

  // 1. Session Check
  async function checkAdminSession() {
    const { data: { session } } = await db.auth.getSession();
    if (session) {
      document.getElementById('loginOverlay').style.display = 'none';
      initDashboard();
    } else {
      document.getElementById('loginOverlay').style.display = 'flex';
    }
  }

  // 2. Login Form Handler
  document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('adminEmail').value;
    const password = document.getElementById('adminPassword').value;
    const errorDiv = document.getElementById('loginError');

    errorDiv.style.display = 'none';

    const { data, error } = await db.auth.signInWithPassword({
      email: email,
      password: password
    });

    if (error) {
      errorDiv.textContent = error.message;
      errorDiv.style.display = 'block';
    } else {
      document.getElementById('loginOverlay').style.display = 'none';
      initDashboard();
    }
  });

  // 3. Logout Handler
  async function handleLogout() {
    await db.auth.signOut();
    window.location.reload();
  }

  // 4. Load Data & Subscriptions
  async function initDashboard() {
    document.getElementById('statusDot').className = 'dot live';
    document.getElementById('statusText').textContent = 'Live Database Connected';

    const { data, error } = await db.from('contacts').select('*').order('created_at', { ascending: false });
    if (!error && data) {
      contacts = data;
      renderContacts();
    }
  }

  function renderContacts() {
    const tbody = document.getElementById('contactBody');
    document.getElementById('contactCount').textContent = contacts.length;

    if (!contacts.length) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">No records found.</td></tr>';
      return;
    }

    tbody.innerHTML = contacts.map(c => `
      <tr>
        <td>${c.name || ''}</td>
        <td>${c.email || ''}</td>
        <td>${c.phone || ''}</td>
        <td>${c.message || ''}</td>
        <td>${new Date(c.created_at).toLocaleString()}</td>
      </tr>
    `).join('');
  }

  // Execute on load
  checkAdminSession();
</script>

</body>
</html>
